paths:
  data_dir: data
  models_dir: models
  output_dir: output
  cache_dir: data/cache

video:
  sampling_fps: 2.0
  processing_width: 480
  encoder: h264_nvenc

features:
  window_duration: 4.0
  window_stride: 2.0

model:
  checkpoint: models/best_model.pt
  inference_batch_size: 256

selection:
  min_clip: 3.0
  max_clip_duration: 0.0
  junk_threshold: 0.20
  action_threshold: 0.60
  flow_threshold: 0.40
  max_gap_to_merge: 3.0
  padding_seconds: 2.0
  p2_envelope_decay: 0.0

audio:
  sync_mode: combined
  max_clip_duration: 0.0
  fade_duration: 2.0

logging:
  level: INFO