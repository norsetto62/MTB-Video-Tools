paths:
  data_dir: data
  models_dir: models
  output_dir: output
  cache_dir: data/cache

video:
  sampling_fps: 2.0
  processing_width: 480

features:
  window_duration: 4.0
  window_stride: 2.0

model:
  checkpoint: models/best_model.pt
  inference_batch_size: 256

selection:
  target_duration: 120.0
  min_clip: 3.0
  max_clip_duration: 0.0
  junk_threshold: 0.55
  action_threshold: 0.50
  score_threshold: 0.60
  min_candidate_duration: 4.0
  max_gap_to_merge: 3.0
  padding_seconds: 2.0

audio:
  sync_mode: off
  max_clip_duration: 0.0
  fade_duration: 2.0

logging:
  level: INFO