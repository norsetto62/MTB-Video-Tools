paths:
  data_dir: data
  models_dir: models
  cache_dir: data/cache

data:
  manifest: data/manifest/annotations_manifest.yaml
  sampling_fps: 2.0
  processing_width: 480
  window_duration: 4.0
  window_stride: 2.0
  train_groups: [ascoli, mentorella, castelli, g2, orvinio, firstday, gas, artemisio, tivoli]
  validation_groups: [castelli_eval]

hpo:
  study_name: mtb_autocut_study
  n_trials: 10
  proxy_test_groups: [artemisio, ascoli, castelli, mentorella]
  search_space:
    lr:
      low: 1.0e-5
      high: 1.0e-3
      log: true
    weight_decay:
      low: 1.0e-4
      high: 1.0e-1
      log: true
    dropout:
      low: 0.2
      high: 0.6
    class_weight_0:
      low: 0.1
      high: 0.6
    class_weight_2:
      low: 2.0
      high: 10.0
    hidden_dim:
      choices: [32, 64, 128]

training:
  epochs: 40
  lr: 0.00007
  batch_size: 32
  hidden_dim: 64
  classifier_mid_dim: 32
  dropout: 0.5
  num_classes: 3
  use_scaling: true
  patience: 20
  min_delta: 0.0001
  weight_decay: 0.01
  seed: 42
  class_weights: [0.35, 1.0, 5.2]

logging:
  level: INFO