data_dir: data
models_dir: models
cache_dir: data/cache

hpo:
  study_name: mtb_autocut_study
  n_trials: 25
  proxy_test_groups: [artemisio, ascoli, castelli, mentorella]

data:
  manifest: data/manifest/annotations_manifest.yaml
  sampling_fps: 2.0
  processing_width: 480
  window_duration: 4.0
  window_stride: 2.0
  train_groups: [ascoli, mentorella, castelli, g2, orvinio, firstday, gas, artemisio, tivoli]
  validation_groups: [castelli_eval]

training:
  epochs: 25
  batch_size: 32
  hidden_dim: 64
  classifier_mid_dim: 32
  num_classes: 3
  use_scaling: true
  patience: 10
  min_delta: 0.0001
  seed: 42

logging:
  level: INFO