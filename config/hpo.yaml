paths:
  data_dir: data
  models_dir: models
  cache_dir: data/cache

hpo:
  study_name: study_2
  n_trials: 10
  proxy_test_groups: [ascoli, castelli, mentorella]
  search_space:
    lr:
      low: 1.0e-6
      high: 1.0e-4
      log: true
    weight_decay:
      low: 1.0e-3
      high: 1.0e-1
      log: true
    dropout:
      low: 0.4
      high: 0.8
    class_weight_0:
      low: 0.5
      high: 1.5
    class_weight_2:
      low: 1.5
      high: 3.5
    hidden_dim:
      choices: [64, 128, 256]

data:
  manifest: data/manifest/annotations_manifest.yaml
  sampling_fps: 2.0
  processing_width: 480
  window_duration: 4.0
  window_stride: 2.0
  train_groups: [ascoli, mentorella, castelli, g2, orvinio, firstday, gas, tivoli]
  validation_groups: [castelli_eval]

training:
  epochs: 25
  batch_size: 32
  hidden_dim: 64
  classifier_mid_dim: 32
  num_classes: 3
  use_scaling: true
  patience: 10
  min_delta: 0.0001
  seed: 890

# Suppress verbose per-epoch training logs to keep the console clean during batch tuning
logging:
  level: WARNING